#
# Builds a DEBUG apk of the Video Ref fork of Squore (this repository, not obbimi/Squore)
# - no release keystore or google-services.json needed
# - the apk is signed with the (non secret) debug keystore videoref-debug.keystore committed in this repo
# - applicationId gets suffix '.videoref' and app label 'Squore VR', so it installs next to the official Squore app
#
# Download the apk (no login needed, direct link to share with referees):
#   https://github.com/motocanalrepuestos-afk/Squore/releases/latest/download/Squore-VR.apk
# Also available as workflow artifact: GitHub > Actions > latest run > Artifacts > squore-video-ref-debug-apk
#
name: Build Squore Video Ref debug APK
run-name: Build Squore Video Ref debug APK (${{ github.ref_name }})

on:
  push:
    branches:
      - video-ref
  workflow_dispatch: # run manually

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code of this repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: gradle

    - name: Prepare for build
      run: |
        set -x
        chmod +x ./gradlew ./build.gradle.adapt.for.github.workflow.sh
        # without GSM key: do not use com.google.gms, comment out release signing (that would throw without keystore), create dummy res/raw/squore_iddo.zip
        ./build.gradle.adapt.for.github.workflow.sh ""
        ls -l res/raw/squore_iddo.zip
        echo "ANDROID_HOME=${ANDROID_HOME} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

    - name: Build debug .apk (phone/tablet, Android 7.1+)
      run: |
        ./gradlew --no-daemon --stacktrace assemblePhoneTabletPost25Debug

    - name: List generated .apk files
      run: |
        find build/outputs -name '*.apk' -ls

    - name: Upload .apk as workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: squore-video-ref-debug-apk
        path: build/outputs/apk/**/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: Publish .apk as release 'Squore VR' (direct download link)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -x
        APK=$(find build/outputs/apk -name '*.apk' | head -1)
        cp "$APK" Squore-VR.apk
        NOTES="Squore con Video Ref. Descarga directa: https://github.com/${{ github.repository }}/releases/latest/download/Squore-VR.apk (build ${{ github.run_number }}, commit ${GITHUB_SHA::7})"
        if gh release view squore-vr >/dev/null 2>&1; then
          gh release upload squore-vr Squore-VR.apk --clobber
          gh release edit squore-vr --notes "$NOTES" --latest
        else
          gh release create squore-vr Squore-VR.apk --title "Squore VR" --notes "$NOTES" --latest --target "$GITHUB_SHA"
        fi
